name: Feature Request
description: Suggest a new feature or improvement for Vanguard
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make Vanguard better? We'd love to hear it!

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this feature solve? What's frustrating about the current behavior?
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe how you'd like this to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've thought about?

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Vanguard does this relate to?
      options:
        - CLI / Terminal UX
        - Code Generation
        - Multi-File Editing
        - Testing / Validation
        - Provider Integration
        - Configuration
        - Documentation
        - Performance
        - Other
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues and this hasn't been requested
          required: true
        - label: I'd be willing to submit a PR for this
          required: false
